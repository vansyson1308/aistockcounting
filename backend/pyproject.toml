[project]
name = "vj-stockcount-backend"
version = "0.1.0"
description = "VietJewelers AI stock counting backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "boto3>=1.35.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "numpy>=1.26.4",
  "onnxruntime>=1.18.1",
  "python-dateutil>=2.9.0",
  "slowapi>=0.1.9",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2",
  "mypy>=1.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["tests/test_*.py"]
