# nginx for the AWS deployment (CloudFront -> EC2:80 -> backend / frontend).
#
# Differs from nginx.conf (local dev) in three ways:
#  1. Upstreams are resolved at request time through Docker's embedded DNS.
#     `docker compose up -d` recreates backend/frontend on every deploy with new
#     container IPs; a static proxy_pass would keep the old IP and return 502
#     until nginx itself restarted.
#  2. X-Forwarded-Proto is always "https". CloudFront redirects every viewer
#     request to HTTPS and talks to this origin over plain HTTP, so $scheme
#     would wrongly tell the apps the page was served over http.
#  3. /nginx-health for the container health check.
# Access control is done by the security group: port 80 only accepts the
# CloudFront origin-facing managed prefix list.
worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # Docker's embedded DNS server; re-resolve container names every 10 s.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80 default_server;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:;" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # CloudFront waits 60 s for the origin; agent runs take up to ~20 s.
    proxy_read_timeout 75s;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # With a variable in proxy_pass and no URI part, nginx forwards the
    # original request URI unchanged (same result as nginx.conf's mapping).
    location /api/ {
      set $backend_upstream http://backend:8000;
      proxy_pass $backend_upstream;
    }

    location = /health {
      set $backend_upstream http://backend:8000;
      proxy_pass $backend_upstream;
    }

    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
    }
  }
}
