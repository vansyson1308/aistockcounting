name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/aistockcounting-backend
            ghcr.io/${{ github.repository_owner }}/aistockcounting-frontend
          tags: |
            type=ref,event=tag
            type=sha
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aistockcounting-backend:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/aistockcounting-backend:${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aistockcounting-frontend:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/aistockcounting-frontend:${{ github.sha }}
